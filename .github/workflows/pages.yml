# v2 web UI on GitHub Pages, served at https://<owner>.github.io/Veilance/.
# VITE_V2_DEMO=auto: it talks to the presenter's live Preprod node when that answers
# (scripts/live-demo.sh prints the `?api=` link), otherwise visitors can open the
# in-browser simulation (web/src/v2/sim.ts). Repo variable VEILANCE_V2_URL, if set,
# is the default node URL.
name: Demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/**", "shared/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx vite build
        working-directory: web
        env:
          VITE_V2_DEMO: auto
          VITE_V2_URL: ${{ vars.VEILANCE_V2_URL }}
          VITE_BASE: /Veilance/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
